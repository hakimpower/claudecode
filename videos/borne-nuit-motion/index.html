<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Orbitron";
        src: url("assets/fonts/orbitron.woff2") format("woff2");
        font-weight: 400 900;
      }
      @font-face {
        font-family: "Urbanist";
        src: url("assets/fonts/urbanist.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --night: #102203;
        --night-deep: #0a1602;
        --teal: #01998e;
        --volt: #f6fe67;
        --white: #ffffff;
        --mute: rgba(255, 255, 255, 0.62);
        --grad: linear-gradient(90deg, #01998e 0%, #f6fe67 100%);
        --display: "Orbitron", sans-serif;
        --body: "Urbanist", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 70% at 50% 0%, #17320a 0%, var(--night) 55%, var(--night-deep) 100%);
        font-family: var(--body);
        color: var(--white);
      }

      /* ── sky decor ── */
      #stars,
      #dawn,
      #sun,
      #moon {
        position: absolute;
        pointer-events: none;
      }
      #stars {
        inset: 0;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: var(--white);
      }
      #dawn {
        inset: 0;
        background:
          radial-gradient(ellipse 90% 45% at 50% 62%, rgba(246, 254, 103, 0.28) 0%, rgba(1, 153, 142, 0.22) 45%, transparent 75%);
        opacity: 0;
      }
      #moon {
        right: 120px;
        top: 640px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        box-shadow: inset -30px 8px 0 0 #e9f6c4;
        filter: drop-shadow(0 0 22px rgba(233, 246, 196, 0.45));
      }
      #sun {
        left: 50%;
        top: 820px;
        width: 220px;
        height: 220px;
        margin-left: -110px;
        border-radius: 50%;
        background: radial-gradient(circle, #fbffb8 0%, var(--volt) 45%, rgba(246, 254, 103, 0) 72%);
        opacity: 0;
      }

      /* ── main night scene ── */
      #scene {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 210px 80px 330px;
        gap: 28px;
      }
      .clock-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .eyebrow {
        font-family: var(--body);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #clock {
        font-family: var(--display);
        font-weight: 900;
        font-size: 200px;
        line-height: 1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(90deg, #ffffff, #ffffff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .eyebrow-wrap,
      .clock-box {
        display: grid;
        justify-items: center;
      }
      .eyebrow-wrap > *,
      .clock-box > * {
        grid-area: 1 / 1;
      }
      #eyebrow-am {
        opacity: 0;
      }
      #clock-day {
        font-family: var(--display);
        font-weight: 900;
        font-size: 200px;
        line-height: 1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
      }
      .captions {
        position: relative;
        width: 100%;
        height: 96px;
      }
      .cap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--body);
        font-weight: 800;
        font-size: 66px;
        letter-spacing: -0.01em;
        opacity: 0;
      }
      .cap em {
        font-style: normal;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #garage {
        width: 1000px;
        height: 700px;
        flex: none;
      }
      .gauge {
        width: 860px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .gauge-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .gauge-label {
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #pct {
        font-family: var(--display);
        font-weight: 900;
        font-size: 84px;
        font-variant-numeric: tabular-nums;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .bar {
        position: relative;
        height: 40px;
        border-radius: 20px;
        border: 3px solid rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      #bar-fill {
        position: absolute;
        inset: 4px;
        border-radius: 14px;
        background: var(--grad);
        transform-origin: left center;
        box-shadow: 0 0 30px rgba(246, 254, 103, 0.45);
      }

      /* ── outro ── */
      #outro {
        position: absolute;
        inset: 0;
      }
      .outro-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 220px 90px 340px;
        gap: 34px;
        text-align: center;
      }
      #logo {
        width: 640px;
        height: 640px;
        filter: drop-shadow(0 0 40px rgba(1, 153, 142, 0.45));
        opacity: 0;
        visibility: hidden;
      }
      .pill {
        padding: 18px 46px;
        border-radius: 999px;
        background: var(--grad);
        color: var(--night);
        font-family: var(--display);
        font-weight: 900;
        font-size: 46px;
        letter-spacing: 0.06em;
      }
      .site {
        font-weight: 800;
        font-size: 64px;
      }
      .site small {
        display: block;
        font-weight: 500;
        font-size: 34px;
        color: var(--mute);
        margin-bottom: 4px;
      }
      .phone {
        font-family: var(--display);
        font-weight: 700;
        font-size: 64px;
        letter-spacing: 0.04em;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .france {
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="stars"></div>
      <div id="dawn"></div>
      <div id="moon"></div>
      <div id="sun"></div>

      <!-- ── Scene: la nuit fait le travail (0 → 10.6s) ── -->
      <div id="scene" class="clip" data-start="0" data-duration="10.6" data-track-index="0">
        <div class="scene-content">
          <div class="clock-wrap">
            <div class="eyebrow-wrap">
              <div class="eyebrow" id="eyebrow">Ce soir</div>
              <div class="eyebrow" id="eyebrow-am">Ce matin</div>
            </div>
            <div class="clock-box">
              <div id="clock">22:00</div>
              <div id="clock-day">07:00</div>
            </div>
          </div>

          <div class="captions">
            <div class="cap" id="cap1">Vous rentrez chez vous.</div>
            <div class="cap" id="cap2">Un clic. <em>&nbsp;C'est branché.</em></div>
            <div class="cap" id="cap3">Vous dormez…</div>
            <div class="cap" id="cap4"><em>Elle se recharge.</em></div>
            <div class="cap" id="cap5"><em>Bonne route !</em></div>
          </div>

          <svg id="garage" viewBox="0 0 1000 700" fill="none">
            <defs>
              <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#01998E" />
                <stop offset="1" stop-color="#F6FE67" />
              </linearGradient>
              <linearGradient id="g-cable" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="330" y2="0">
                <stop offset="0" stop-color="#01998E" />
                <stop offset="1" stop-color="#F6FE67" />
              </linearGradient>
              <linearGradient id="g-floor" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#01998E" stop-opacity="0" />
                <stop offset="0.5" stop-color="#01998E" stop-opacity="0.8" />
                <stop offset="1" stop-color="#F6FE67" stop-opacity="0" />
              </linearGradient>
              <radialGradient id="g-glow">
                <stop offset="0" stop-color="#F6FE67" stop-opacity="0.9" />
                <stop offset="1" stop-color="#01998E" stop-opacity="0" />
              </radialGradient>
            </defs>

            <!-- floor -->
            <line id="floor" x1="0" y1="610" x2="1000" y2="610" stroke="url(#g-floor)" stroke-width="4" />

            <!-- wallbox -->
            <g id="wallbox">
              <circle id="wb-glow" cx="100" cy="260" r="96" fill="url(#g-glow)" opacity="0" />
              <rect x="40" y="170" width="120" height="190" rx="22" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" />
              <rect x="66" y="205" width="68" height="40" rx="8" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" />
              <circle id="wb-led" cx="100" cy="300" r="13" fill="#3a4a30" />
            </g>

            <!-- cable: wallbox → car charge port -->
            <path
              id="cable"
              d="M100 360 C100 470 150 560 230 545 C300 532 300 470 336 452"
              stroke="url(#g-cable)"
              stroke-width="14"
              stroke-linecap="round"
            />
            <path
              id="energy"
              d="M100 360 C100 470 150 560 230 545 C300 532 300 470 336 452"
              stroke="#fbffb8"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="10 46"
              opacity="0"
            />

            <!-- car (logo-style outline) -->
            <g id="car" transform="translate(300 250) scale(0.8)">
              <path
                id="car-body"
                d="M175 330 L80 330 C50 330 40 300 50 270 C70 222 140 206 232 196 C300 122 420 92 540 100 C650 110 730 170 780 225 C830 236 860 262 860 300 C860 320 850 330 830 330 L760 330 M302 330 L608 330"
                stroke="url(#g-brand)"
                stroke-width="26"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="car-window"
                d="M300 196 C360 150 440 134 520 140 C580 146 630 172 668 210 Z"
                stroke="#ffffff"
                stroke-opacity="0.35"
                stroke-width="8"
                stroke-linejoin="round"
              />
              <circle class="wheel" cx="240" cy="330" r="62" stroke="url(#g-brand)" stroke-width="26" />
              <circle class="wheel" cx="670" cy="330" r="62" stroke="url(#g-brand)" stroke-width="26" />
              <circle id="port-glow" cx="45" cy="252" r="46" fill="url(#g-glow)" opacity="0" />
            </g>
          </svg>

          <div class="gauge" id="gauge">
            <div class="gauge-head">
              <span class="gauge-label">Batterie</span>
              <span id="pct">20 %</span>
            </div>
            <div class="bar"><div id="bar-fill"></div></div>
          </div>
        </div>
      </div>

      <!-- ── Outro: logo + infos (10.3 → 15s) ── -->
      <div id="outro" class="clip" data-start="10.3" data-duration="4.7" data-track-index="1">
        <div class="outro-content">
          <img id="logo" src="assets/brand/logo.png" alt="Power Recharge" />
          <div class="pill" id="o-pill">DEVIS GRATUIT</div>
          <div class="site" id="o-site"><small>sur notre site</small>power-recharge.fr</div>
          <div class="phone" id="o-phone">01 89 70 19 39</div>
          <div class="france" id="o-france">Installation partout en France</div>
        </div>
      </div>

      <!-- ── SFX (no music) ── -->
      <audio id="sfx-whoosh-in" src="assets/sfx/whoosh-short.mp3" data-start="0.12" data-duration="0.57" data-volume="0.5" data-track-index="2"></audio>
      <audio id="sfx-click" src="assets/sfx/click.mp3" data-start="1.72" data-duration="0.37" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-ping" src="assets/sfx/ping.mp3" data-start="1.85" data-duration="1.32" data-volume="0.55" data-track-index="3"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="2.5" data-duration="5.53" data-media-start="4.5" data-volume="0.5" data-fade-in="1" data-track-index="4"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.mp3" data-start="8.0" data-duration="2.54" data-volume="0.85" data-track-index="2"></audio>
      <audio id="sfx-unplug" src="assets/sfx/click.mp3" data-start="9.2" data-duration="0.37" data-volume="0.6" data-track-index="3"></audio>
      <audio id="sfx-whoosh-out" src="assets/sfx/whoosh.mp3" data-start="9.62" data-duration="0.57" data-volume="0.75" data-track-index="5"></audio>
      <audio id="sfx-impact" src="assets/sfx/impact-bass-1.mp3" data-start="10.45" data-duration="2.12" data-volume="0.7" data-track-index="3"></audio>
      <audio id="sfx-sparkle" src="assets/sfx/sparkle.mp3" data-start="10.75" data-duration="1.8" data-volume="0.5" data-track-index="4"></audio>
      <audio id="sfx-pop1" src="assets/sfx/pop.mp3" data-start="11.55" data-duration="0.72" data-volume="0.6" data-track-index="2"></audio>
      <audio id="sfx-pop2" src="assets/sfx/pop.mp3" data-start="12.1" data-duration="0.72" data-volume="0.6" data-track-index="5"></audio>
      <audio id="sfx-pop3" src="assets/sfx/pop.mp3" data-start="12.65" data-duration="0.72" data-volume="0.6" data-track-index="4"></audio>
      <audio id="sfx-pop4" src="assets/sfx/pop.mp3" data-start="13.2" data-duration="0.72" data-volume="0.6" data-track-index="2"></audio>
    </div>

    <script>
      // Deterministic starfield (seeded LCG — no Math.random).
      (function () {
        let seed = 7;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const host = document.getElementById("stars");
        for (let i = 0; i < 70; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const size = 2 + Math.round(rnd() * 4);
          s.style.width = s.style.height = size + "px";
          s.style.left = Math.round(rnd() * 1080) + "px";
          s.style.top = Math.round(rnd() * 1100) + "px";
          s.style.opacity = (0.25 + rnd() * 0.65).toFixed(2);
          host.appendChild(s);
        }
      })();

      const tl = gsap.timeline({ paused: true });
      const $ = (q) => document.querySelector(q);
      const len = (el) => el.getTotalLength();

      // Prepare stroke draw-on lengths.
      const body = $("#car-body");
      const cable = $("#cable");
      const bodyLen = len(body);
      const cableLen = len(cable);
      gsap.set(body, { strokeDasharray: bodyLen, strokeDashoffset: bodyLen });
      gsap.set(cable, { strokeDasharray: cableLen, strokeDashoffset: cableLen });

      // Stable baselines for elements tweened more than once.
      tl.set("#bar-fill", { scaleX: 0.2, filter: "brightness(1)" }, 0);
      tl.set("#energy", { strokeDashoffset: 0 }, 0);
      tl.set("#logo", { scale: 0.55, rotation: -8, filter: "drop-shadow(0 0 0px rgba(246,254,103,0))" }, 0);

      // ── 0 → 1.7 : night opens, car draws in, clock slams ──
      tl.from("#stars .star", { opacity: 0, duration: 0.8, stagger: { each: 0.008 } }, 0);
      tl.from("#moon", { opacity: 0, y: 40, duration: 1, ease: "power2.out" }, 0);
      tl.fromTo("#clock", { scale: 1.5, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "power4.out" }, 0.12);
      tl.fromTo("#eyebrow", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
      tl.fromTo("#floor", { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#wallbox", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.to(body, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.2);
      tl.fromTo(".wheel", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 0.6);
      tl.fromTo("#car-window", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.8);
      tl.fromTo("#gauge", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.fromTo("#cap1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.35);

      // ── 1.1 → 1.75 : cable reaches the car — click ──
      tl.to(cable, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.1);
      tl.to("#cap1", { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" }, 1.5);
      tl.to("#wb-led", { attr: { fill: "#F6FE67" }, duration: 0.1 }, 1.72);
      tl.fromTo("#wb-glow", { opacity: 0 }, { opacity: 0.8, duration: 0.25, ease: "power2.out" }, 1.72);
      tl.fromTo("#port-glow", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.72);
      tl.fromTo("#cap2", { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 1.75);
      tl.to("#garage", { keyframes: [{ x: -6 }, { x: 6 }, { x: 0 }], duration: 0.18, ease: "none" }, 1.74);

      // ── 2.5 → 8.0 : time-lapse — the night does the work ──
      tl.to("#cap2", { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" }, 2.5);
      tl.fromTo("#cap3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.75);
      tl.to("#cap3", { autoAlpha: 0, y: -24, duration: 0.25, ease: "power2.in" }, 4.6);
      tl.fromTo("#cap4", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.85);
      tl.to("#eyebrow", { autoAlpha: 0, duration: 0.2 }, 2.5);

      const clock = { m: 22 * 60 };
      const clockEl = $("#clock");
      const fmt = (mins) => {
        const r = Math.round(mins / 5) * 5;
        const h = Math.floor(r / 60) % 24;
        const m = r % 60;
        return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      };
      tl.to(clock, { m: 31 * 60, duration: 5.5, ease: "power1.inOut", onUpdate: () => (clockEl.textContent = fmt(clock.m)) }, 2.5);

      const batt = { v: 20 };
      const pctEl = $("#pct");
      tl.to(batt, { v: 100, duration: 5.5, ease: "power1.inOut", onUpdate: () => (pctEl.textContent = Math.round(batt.v) + " %") }, 2.5);
      tl.fromTo("#bar-fill", { scaleX: 0.2 }, { scaleX: 1, duration: 5.5, ease: "power1.inOut" }, 2.5);
      tl.fromTo("#energy", { opacity: 0 }, { opacity: 0.9, duration: 0.3, immediateRender: false }, 2.2);
      tl.fromTo("#energy", { strokeDashoffset: 0 }, { strokeDashoffset: -560, duration: 5.8, ease: "none", immediateRender: false }, 2.2);
      tl.to("#wb-glow", { opacity: 0.35, duration: 0.6, yoyo: true, repeat: 7, ease: "sine.inOut" }, 2.2);
      tl.to("#stars", { y: 60, duration: 5.5, ease: "none" }, 2.5);
      tl.to("#moon", { y: 260, x: 60, duration: 5.5, ease: "power1.in" }, 2.5);

      // ── 8.0 : 07:00 — 100 % — morning ──
      tl.to("#cap4", { autoAlpha: 0, y: -24, duration: 0.2, ease: "power2.in" }, 7.8);
      tl.to("#clock", { opacity: 0, duration: 0.12 }, 8.0);
      tl.fromTo("#clock-day", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 8.0);
      tl.fromTo("#pct", { scale: 1 }, { scale: 1.25, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "100% 50%" }, 8.0);
      tl.fromTo("#bar-fill", { filter: "brightness(1)" }, { filter: "brightness(1.6)", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, 8.0);
      tl.fromTo("#cap5", { autoAlpha: 0, scale: 1.3 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 8.05);
      tl.fromTo("#eyebrow-am", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 8.0);
      tl.to("#stars", { opacity: 0, duration: 0.8 }, 8.0);
      tl.to("#moon", { opacity: 0, duration: 0.6 }, 8.0);
      tl.fromTo("#dawn", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 8.0);
      tl.fromTo("#sun", { opacity: 0, y: 140 }, { opacity: 0.85, y: 0, duration: 1.1, ease: "power2.out" }, 8.0);
      tl.to("#energy", { opacity: 0, duration: 0.3 }, 8.0);

      // ── 9.2 → 10.3 : unplug, the car drives off ──
      tl.to(cable, { strokeDashoffset: cableLen, duration: 0.4, ease: "power2.in" }, 9.2);
      tl.to("#port-glow", { opacity: 0, duration: 0.2 }, 9.2);
      tl.to("#car", { x: 1150, duration: 0.75, ease: "power3.in" }, 9.6);
